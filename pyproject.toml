[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen2code"
version = "0.1.0.dev0"
description = "Open-source UI reverse-engineering: screenshots to an evidence-aware, framework-independent IR to generated code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.22",
  "playwright>=1.45",
  "pytesseract>=0.3.10",
  "click>=8.1",
  "platformdirs>=4",
  "psutil>=5",
]

[project.scripts]
screen2code = "screen2code.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"screen2code.ir" = ["*.json"]
