<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{font-family:'Liberation Sans',Arial,sans-serif;background:#ffffff;color:#1a1a2e;width:1000px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:#1a1a2e;color:#fff}
header .logo{font-size:22px;font-weight:700}
nav{display:flex;gap:28px;font-size:15px}
.hero{display:flex;gap:40px;padding:50px 40px;background:#f4f6fb}
.hero h1{font-size:40px;line-height:1.2}
.hero p{font-size:16px;margin-top:12px;color:#555}
.btn{display:inline-block;margin-top:20px;padding:12px 24px;background:#2f5bea;color:#fff;border-radius:8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px}
.card{border:1px solid #d5d9e4;border-radius:10px;padding:20px;background:#fff}
.card h3{font-size:20px}.card p{font-size:14px;margin-top:8px;color:#666}
footer{padding:24px 40px;background:#1a1a2e;color:#aab;font-size:13px}
</style></head><body>
<header><div class="logo">Acme Studio</div><nav><span>Products</span><span>Pricing</span><span>About</span></nav></header>
<section class="hero"><div><h1>Build faster</h1><p>Design systems from screenshots</p><div class="btn">Get started</div></div></section>
<section class="grid"><div class="card"><h3>Alpha plan</h3><p>For small teams</p></div><div class="card"><h3>Beta plan</h3><p>For growing teams</p></div><div class="card"><h3>Gamma plan</h3><p>For large teams</p></div></section>
<footer>Copyright 2026 Acme Studio</footer></body></html>
