<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0}body{font-family:"Liberation Sans",Arial,sans-serif;background:#fff;color:#1a1a2e}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:#1a1a2e;color:#fff}
header .logo{font-size:22px;font-weight:700}nav{display:flex;gap:28px;font-size:15px}
footer{padding:24px 40px;background:#1a1a2e;color:#aab;font-size:13px}
.btn{display:inline-block;padding:12px 24px;background:#2f5bea;color:#fff;border-radius:8px;font-size:16px}
.card{border:1px solid #d5d9e4;border-radius:10px;padding:20px;background:#fff}
.card h3{font-size:20px}.card p{font-size:14px;margin-top:8px;color:#666}
.hero{padding:50px 40px;background:#f4f6fb}.hero h1{font-size:40px}.hero p{font-size:16px;margin:12px 0 20px;color:#555}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px}
@media (max-width:600px){header{flex-direction:column;align-items:flex-start;gap:12px;padding:16px 20px}nav{gap:18px}.hero{padding:32px 20px}.hero h1{font-size:30px}.grid{grid-template-columns:1fr;padding:24px 20px;gap:16px}footer{padding:20px}}
</style></head><body><header><div class="logo">Acme Studio</div><nav><span>Products</span><span>Pricing</span><span>About</span></nav></header>
<section class="hero"><h1>Build faster</h1><p>Design systems from screenshots</p><div class="btn">Get started</div></section>
<section class="grid"><div class="card"><h3>Alpha plan</h3><p>For small teams</p></div><div class="card"><h3>Beta plan</h3><p>For growing teams</p></div><div class="card"><h3>Gamma plan</h3><p>For large teams</p></div></section>
<footer>Copyright 2026 Acme Studio</footer></body></html>
