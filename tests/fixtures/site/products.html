<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0}body{font-family:"Liberation Sans",Arial,sans-serif;background:#fff;color:#1a1a2e}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:#1a1a2e;color:#fff}
header .logo{font-size:22px;font-weight:700}nav{display:flex;gap:28px;font-size:15px}
footer{padding:24px 40px;background:#1a1a2e;color:#aab;font-size:13px}
.btn{display:inline-block;padding:12px 24px;background:#3060ea;color:#fff;border-radius:8px;font-size:16px}
.card{border:1px solid #d5d9e4;border-radius:10px;padding:20px;background:#fff}
.card h3{font-size:20px}.card p{font-size:14px;margin-top:8px;color:#666}
.main{padding:40px}.main h1{font-size:34px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card .btn{margin-top:14px;font-size:14px;padding:8px 18px}.card.featured{border:2px solid #2f5bea;border-radius:4px}
</style></head><body><header><div class="logo">Acme Studio</div><nav><span>Products</span><span>Pricing</span><span>About</span></nav></header>
<section class="main"><h1>Our products</h1><div class="grid">
<div class="card"><h3>Starter kit</h3><p>Everything to begin</p><div class="btn">Add to cart</div></div>
<div class="card"><h3>Team kit</h3><p>Built for teams</p><div class="btn">Add to cart</div></div>
<div class="card"><h3>Pro kit</h3><p>For heavy users</p><div class="btn">Add to cart</div></div>
<div class="card featured"><h3>Max kit</h3><p>Our best offer</p><div class="btn">Add to cart</div></div></div></section>
<footer>Copyright 2026 Acme Studio</footer></body></html>
